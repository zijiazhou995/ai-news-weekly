name: Weekly AI News Update

on:
  schedule:
    - cron: '30 1 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate weekly news
        run: python3 -B weekly_ai_news.py run

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs site data/site_weeks.json
          git commit -m "Update weekly AI news" || exit 0
          git push
