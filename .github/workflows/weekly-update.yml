name: Weekly AI News Update v2

on:
  schedule:
    - cron: "0 2 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate weekly v2 site
        run: |
          cd ai-news-weekly-v2
          python -B -m ai_news_weekly.pipeline --editor auto
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-news-weekly-v2/data ai-news-weekly-v2/site
          git diff --cached --quiet || git commit -m "chore: update weekly ai news v2"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload v2 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-news-weekly-v2/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
