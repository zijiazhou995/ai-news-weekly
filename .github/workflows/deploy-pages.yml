name: Deploy AI News Weekly v2

on:
  push:
    branches:
      - main
    paths:
      - "ai-news-weekly-v2/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload v2 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-news-weekly-v2/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
